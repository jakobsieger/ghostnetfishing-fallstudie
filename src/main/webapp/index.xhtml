<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core">

<h:head>
	<title>Ghost Net Fishing</title>
	<style>
.tableColumn {
	padding: 4px 12px;
	border-right: 1px solid black;
}
</style>
</h:head>

<h:body>
	<h1>Ghost Net Fishing</h1>

	<h:dataTable var="ghostNet" value="#{ghostNetController.ghostNets}"
		style="border-collapse: collapse;"
		columnClasses="tableColumn, tableColumn, tableColumn, tableColumn, tableColumn, tableColumn">
		<h:column>
			<f:facet name="header">ID</f:facet>
			<h:outputText value="#{ghostNet.id}" />
		</h:column>
		<h:column>
			<f:facet name="header">Größe</f:facet>
			<h:outputText value="#{ghostNet.size}" />
		</h:column>
		<h:column>
			<f:facet name="header">Standort</f:facet>
			<h:outputText value="#{ghostNet.latitude}, #{ghostNet.longitude}" />
		</h:column>
		<h:column>
			<f:facet name="header">Status</f:facet>
			<h:outputText value="#{ghostNet.status}" />
		</h:column>
		<h:column>
			<f:facet name="header">Gemeldet von</f:facet>
			<h:outputText value="#{ghostNet.reportedBy.name}" />
		</h:column>
		<h:column>
			<f:facet name="header">Aktionen</f:facet>
			<h:form>
				<h:commandButton value="Bergung anmelden"
					action="#{ghostNetController.showSalvagingForm(ghostNet)}"
					rendered="#{ghostNet.status == 'REPORTED'}" />
				<h:commandButton value="Geborgen melden"
					action="#{ghostNetController.showSalvagedForm(ghostNet)}"
					rendered="#{ghostNet.status == 'SALVAGE_REGISTERED'}" />
				<h:commandButton value="Verschollen melden"
					action="#{ghostNetController.showLostForm(ghostNet)}"
					rendered="#{ghostNet.status == 'REPORTED' || ghostNet.status == 'SALVAGE_REGISTERED'}" />
			</h:form>
		</h:column>
	</h:dataTable>
	<br />
	<h:form>
		<h:commandButton value="Geisternetz melden"
			action="#{ghostNetController.showReportForm}" />
	</h:form>
	<br />

	<h:panelGroup rendered="#{ghostNetController.reportFormVisible}">
		<h:form>
			<h:outputText value="Längengrad: " />
			<h:inputText value="#{ghostNetController.newGhostNet.latitude}" />
			<br />
			<h:outputText value="Breitengrad: " />
			<h:inputText value="#{ghostNetController.newGhostNet.longitude}" />
			<br />
			<h:outputText value="Größe: " />
			<h:inputText value="#{ghostNetController.newGhostNet.size}" />
			<br />
			<h:outputText value="Name der meldenden Person: " />
			<h:inputText value="#{ghostNetController.formPerson.name}" />
			<br />
			<h:outputText value="Telefonnummer der meldenden Person: " />
			<h:inputText value="#{ghostNetController.formPerson.phone}" />
			<br />
			<h:commandButton value="Geisternetz speichern"
				action="#{ghostNetController.reportNewGhostNet}" />
		</h:form>
	</h:panelGroup>
	<br />
	<h:panelGroup rendered="#{ghostNetController.salvagingFormVisible}">
		<h:form>
			<h:outputText
				value="Ausgewähltes Geisternetz: #{ghostNetController.selectedGhostNet.id}" />
			<br />
			<h:outputText value="Name der bergenden Person:" />
			<h:panelGroup>
				<h:inputText id="salvageName" required="true"
					requiredMessage="Name erforderlich"
					value="#{ghostNetController.formPerson.name}" />
				<h:message for="salvageName" style="color: red;" />
			</h:panelGroup>
			<br />
			<h:outputText value="Telefonnummer der bergenden Person:" />
			<h:panelGroup>
				<h:inputText id="salvagePhone" required="true"
					requiredMessage="Telefonnummer erforderlich"
					value="#{ghostNetController.formPerson.phone}" />
				<h:message for="salvagePhone" style="color: red;" />
			</h:panelGroup>
			<br />
			<h:commandButton value="Bergung speichern"
				action="#{ghostNetController.registerSalvaging}" />
		</h:form>
	</h:panelGroup>
	<br />
	<h:panelGroup rendered="#{ghostNetController.salvagedFormVisible}">
		<h:form>
			<h:outputText
				value="Ausgewähltes Geisternetz: #{ghostNetController.selectedGhostNet.id}" />
			<br />
			<h:outputText value="Name der bergenden Person:" />
			<h:panelGroup>
				<h:inputText id="salvageName" required="true"
					requiredMessage="Name erforderlich"
					value="#{ghostNetController.formPerson.name}" />
				<h:message for="salvageName" style="color: red;" />
			</h:panelGroup>
			<br />
			<h:outputText value="Telefonnummer der bergenden Person:" />
			<h:panelGroup>
				<h:inputText id="salvagePhone" required="true"
					requiredMessage="Telefonnummer erforderlich"
					value="#{ghostNetController.formPerson.phone}" />
				<h:message for="salvagePhone" style="color: red;" />
			</h:panelGroup>
			<br />
			<h:commandButton value="Bergung durchführen"
				action="#{ghostNetController.reportAsSalvaged}" />
			<h:messages id="salvagedFormMessages" style="color: red;" />
		</h:form>
	</h:panelGroup>
	<br />
	<h:panelGroup rendered="#{ghostNetController.lostFormVisible}">
		<h:form>
			<h:outputText
				value="Ausgewähltes Geisternetz: #{ghostNetController.selectedGhostNet.id}" />
			<br />
			<h:outputText value="Name der meldenden Person:" />
			<h:panelGroup>
				<h:inputText id="lostName" required="true"
					requiredMessage="Name erforderlich"
					value="#{ghostNetController.formPerson.name}" />
				<h:message for="lostName" style="color: red;" />
			</h:panelGroup>
			<br />
			<h:outputText value="Telefonnummer der meldenden Person:" />
			<h:panelGroup>
				<h:inputText id="lostPhone" required="true"
					requiredMessage="Telefonnummer erforderlich"
					value="#{ghostNetController.formPerson.phone}" />
				<h:message for="lostPhone" style="color: red;" />
			</h:panelGroup>
			<br />
			<h:commandButton value="Verschollen melden"
				action="#{ghostNetController.reportAsLost}" />
		</h:form>
	</h:panelGroup>
</h:body>

</html>
